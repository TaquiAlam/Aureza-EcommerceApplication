spring.application.name=sb-ecom
# Datasource Configuration (Override using DB_URL, DB_USERNAME, DB_PASSWORD env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# project folder for image
project.file=images/

# JWT Configuration (Override using JWT_SECRET env var)
spring.app.jwtSecret=${JWT_SECRET:mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm_change_in_prod}
spring.app.jwtExpirationMs=3000000
spring.app.jwtcookie=springBootEcom



#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.com.ecommerce.project=DEBUG
# needed if you deploy on elastic beanstack
server.port=5000